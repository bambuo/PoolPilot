<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PoolPilot">
  <title>PoolPilot</title>
  <!-- 金点＝资金池，金色轨迹＝池子的交易动作，蓝点＝沿着轨迹跟进来的本系统
       （点与轨迹之间留一道缝：是"正在跟上"，不是"已经贴上"）。
       两个实心点 + 一条线：没有比这更少的笔画，缩到 16px 也不糊。 -->
  <path
    d="M14.6 19.6 Q 19 17.4 21.8 14.2"
    fill="none"
    stroke="#f0b90b"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <circle cx="9.5" cy="22" r="5" fill="#f0b90b" />
  <circle cx="26" cy="9.2" r="3.5" fill="#3c7eff" />
</svg>
